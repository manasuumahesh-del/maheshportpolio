<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BMW Car Models</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #0a1a2f;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .car-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .car-card {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            padding: 20px;
        }
        footer {
            background-color: #0a1a2f;
            color: white;
            text-align: center;
            padding: 12px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

<header>
    <h1>BMW Car Models</h1>
    <p>Luxury • Performance • Innovation</p>
</header>

<div class="container">
    <div class="car-grid">
        <div class="car-card"><h3>BMW 3 Series</h3><p>Sporty luxury sedan.</p></div>
        <div class="car-card"><h3>BMW 5 Series</h3><p>Executive premium sedan.</p></div>
        <div class="car-card"><h3>BMW 7 Series</h3><p>Flagship luxury sedan.</p></div>
        <div class="car-card"><h3>BMW X3</h3><p>Compact luxury SUV.</p></div>
        <div class="car-card"><h3>BMW X5</h3><p>Mid-size luxury SUV.</p></div>
        <div class="car-card"><h3>BMW i4</h3><p>Electric sports sedan.</p></div>
    </div>
</div>

<footer>
    <p>© 2026 BMW Cars | Sample HTML Page</p>
</footer>

</body>
</html>
